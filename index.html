<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMW MGU Pac-Man (5 vaiduokliai)</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 384px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        canvas {
            border: 3px solid #0066B1;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 102, 177, 0.6);
        }
        .hint {
            margin-top: 8px;
            font-size: 13px;
            color: #8fa3bf;
            text-align: center;
        }
        button {
            margin-top: 8px;
            background: #1c2433;
            color: #fff;
            border: 1px solid #0066B1;
            padding: 8px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:focus, button:active {
            background: #0066B1;
            outline: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>TAŠKAI: <span id="score">0</span></div>
        <div id="status" style="color: #FFD700;"></div>
    </div>
    <canvas id="gameCanvas" width="384" height="384"></canvas>
    <div class="hint">Suk iDrive ratuką (posūkiai) arba palenk į šonus | Spausk ratuką: iš naujo</div>
    <button id="restartBtn" onclick="initGame()">Pradėti iš naujo</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const statusEl = document.getElementById("status");
        const restartBtn = document.getElementById("restartBtn");

        const TILE = 24;
        const ROWS = 16;
        const COLS = 16;

        // # = siena, . = taškas, o = galios tabletė (iš viso 12 vnt.), tarpas = tuščia
        const mapLayout = [
            "################",
            "#o.....##.....o#",
            "#.###..##..###.#",
            "#...o......o...#",
            "#.###.####.###.#",
            "#.....#  #.....#",
            "#####.#  #.#####",
            "#..o..#  #..o..#",
            "#####.####.#####",
            "#.....o..o.....#",
            "#.###.####.###.#",
            "#...o......o...#",
            "#.###..##..###.#",
            "#o.....##.....o#",
            "#..............#",
            "################"
        ];

        const DIRS = [
            { dx: 1, dy: 0 },
            { dx: 0, dy: 1 },
            { dx: -1, dy: 0 },
            { dx: 0, dy: -1 }
        ];

        let map = [];
        let score = 0;
        let gameOver = false;
        let powerMode = 0;
        let currentDirIdx = 0;
        let nextDirIdx = 0;
        let pacman = { x: 1, y: 1, dx: 1, dy: 0 };
        let ghosts = [];

        function turn(step) {
            nextDirIdx = (currentDirIdx + step + 4) % 4;
        }

        function setAbsoluteDir(idx) {
            nextDirIdx = idx;
        }

        function initGame() {
            map = mapLayout.map(row => row.split(""));
            score = 0;
            gameOver = false;
            powerMode = 0;
            scoreEl.innerText = score;
            statusEl.innerText = "";
            currentDirIdx = 0;
            nextDirIdx = 0;
            pacman = { x: 1, y: 1, dx: 1, dy: 0 };
            
            // 5 vaiduokliai
            ghosts = [
                { x: 7, y: 7, color: "#FF0000", dx: 0, dy: -1 }, // Raudonas
                { x: 8, y: 7, color: "#FFB8FF", dx: 0, dy: -1 }, // Rožinis
                { x: 7, y: 6, color: "#00FFFF", dx: 0, dy: -1 }, // Žydras
                { x: 8, y: 6, color: "#FFB852", dx: 0, dy: -1 }, // Oranžinis
                { x: 7, y: 5, color: "#00FF00", dx: 1, dy: 0 }   // Žalias
            ];
            restartBtn.blur();
        }

        function canMove(x, y) {
            return x >= 0 && x < COLS && y >= 0 && y < ROWS && map[y][x] !== "#";
        }

        function update() {
            if (gameOver) return;
            if (powerMode > 0) powerMode--;

            let nd = DIRS[nextDirIdx];
            if (canMove(pacman.x + nd.dx, pacman.y + nd.dy)) {
                currentDirIdx = nextDirIdx;
                pacman.dx = nd.dx;
                pacman.dy = nd.dy;
            }

            if (canMove(pacman.x + pacman.dx, pacman.y + pacman.dy)) {
                pacman.x += pacman.dx;
                pacman.y += pacman.dy;
            }

            if (map[pacman.y][pacman.x] === ".") {
                map[pacman.y][pacman.x] = " ";
                score += 10;
                scoreEl.innerText = score;
            } else if (map[pacman.y][pacman.x] === "o") {
                map[pacman.y][pacman.x] = " ";
                score += 50;
                powerMode = 30;
                scoreEl.innerText = score;
            }

            if (!map.some(row => row.includes(".") || row.includes("o"))) {
                gameOver = true;
                statusEl.innerText = "LAIMĖJOTE!";
                return;
            }

            ghosts.forEach(ghost => {
                let validDirs = DIRS.filter(d => canMove(ghost.x + d.dx, ghost.y + d.dy));
                let nonReverse = validDirs.filter(d => !(d.dx === -ghost.dx && d.dy === -ghost.dy));
                if (nonReverse.length > 0) validDirs = nonReverse;

                if (validDirs.length > 0) {
                    const choice = validDirs[Math.floor(Math.random() * validDirs.length)];
                    ghost.dx = choice.dx;
                    ghost.dy = choice.dy;
                    ghost.x += ghost.dx;
                    ghost.y += ghost.dy;
                }

                if (ghost.x === pacman.x && ghost.y === pacman.y) {
                    if (powerMode > 0) {
                        ghost.x = 7;
                        ghost.y = 7;
                        score += 200;
                        scoreEl.innerText = score;
                    } else {
                        gameOver = true;
                        statusEl.innerText = "PABAIGA!";
                    }
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (map[r][c] === "#") {
                        ctx.fillStyle = "#0066B1";
                        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
                    } else if (map[r][c] === ".") {
                        ctx.fillStyle = "#FFB8AE";
                        ctx.beginPath();
                        ctx.arc(c * TILE + TILE / 2, r * TILE + TILE / 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (map[r][c] === "o") {
                        ctx.fillStyle = "#FFB8AE";
                        ctx.beginPath();
                        ctx.arc(c * TILE + TILE / 2, r * TILE + TILE / 2, 6.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            const angles = [0, 0.5 * Math.PI, Math.PI, 1.5 * Math.PI];
            const rot = angles[currentDirIdx];

            ctx.fillStyle = "#FFFF00";
            ctx.beginPath();
            ctx.arc(pacman.x * TILE + TILE / 2, pacman.y * TILE + TILE / 2, TILE / 2 - 2, rot + 0.2 * Math.PI, rot + 1.8 * Math.PI);
            ctx.lineTo(pacman.x * TILE + TILE / 2, pacman.y * TILE + TILE / 2);
            ctx.fill();

            ghosts.forEach(ghost => {
                ctx.fillStyle = powerMode > 0 ? "#2121FF" : ghost.color;
                ctx.beginPath();
                ctx.arc(ghost.x * TILE + TILE / 2, ghost.y * TILE + TILE / 2, TILE / 2 - 2, Math.PI, 0);
                ctx.lineTo(ghost.x * TILE + TILE - 2, ghost.y * TILE + TILE - 2);
                ctx.lineTo(ghost.x * TILE + 2, ghost.y * TILE + TILE - 2);
                ctx.fill();
            });
        }

        let lastWheelTime = 0;
        window.addEventListener("wheel", e => {
            e.preventDefault();
            const now = Date.now();
            if (now - lastWheelTime < 150) return;
            lastWheelTime = now;

            if (e.deltaY > 0 || e.deltaX > 0) {
                turn(1);
            } else if (e.deltaY < 0 || e.deltaX < 0) {
                turn(-1);
            }
        }, { passive: false });

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowRight") setAbsoluteDir(0);
            if (e.key === "ArrowDown") setAbsoluteDir(1);
            if (e.key === "ArrowLeft") setAbsoluteDir(2);
            if (e.key === "ArrowUp") setAbsoluteDir(3);
            if (e.key === "Enter" || e.key.toLowerCase() === "r") initGame();
        });

        let touchStartX = 0, touchStartY = 0;
        window.addEventListener("touchstart", e => {
            touchStartX = e.touches.clientX;
            touchStartY = e.touches.clientY;
        });
        window.addEventListener("touchend", e => {
            let dx = e.changedTouches.clientX - touchStartX;
            let dy = e.changedTouches.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 20) setAbsoluteDir(0);
                else if (dx < -20) setAbsoluteDir(2);
            } else {
