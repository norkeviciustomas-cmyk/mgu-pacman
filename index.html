<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BMW MGU Pac-Man Ultra Smooth</title>
<style>
body{background:#0b0e14;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden;touch-action:none}
.h{display:flex;justify-content:space-between;width:368px;font-size:20px;font-weight:bold;margin-bottom:6px}
canvas{border:3px solid #0066B1;background:#000}
.btns{display:flex;gap:8px;margin-top:8px}
button{background:#1c2433;color:#fff;border:1px solid #0066B1;padding:10px 16px;font-size:16px;border-radius:6px;cursor:pointer}
button:active,button:focus{background:#0066B1;outline:none}
</style>
</head>
<body>
<div class="h"><div>TAŠKAI: <span id="s">0</span></div><div id="st" style="color:#FFD700"></div></div>
<canvas id="c" width="368" height="368"></canvas>
<div class="btns">
<button onclick="nd=3">▲</button>
<button onclick="nd=2">◀</button>
<button onclick="nd=1">▼</button>
<button onclick="nd=0">▶</button>
<button onclick="init()">Iš naujo</button>
</div>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d"),sE=document.getElementById("s"),stE=document.getElementById("st"),T=23,R=16,C=16,SPD=4.4;
const L=[
"################",
"#o.....##.....o#",
"#.###..##..###.#",
"#...o......o...#",
"#.###.#  #.###.#",
"#.....#  #.....#",
"#####.#  #.#####",
"#..o..#  #..o..#",
"#####.####.#####",
"#.....o..o.....#",
"#.###.####.###.#",
"#...o......o...#",
"#.###..##..###.#",
"#o.....##.....o#",
"#..............#",
"################"
];
const D=[{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}];
let m=[],sc=0,over=0,pw=0,cd=0,nd=0,p={},g=[],lt=0;
function turn(s){nd=(cd+s+4)%4}
function init(){
m=L.map(r=>r.split(""));sc=0;over=0;pw=0;sE.innerText=0;stE.innerText="";cd=0;nd=0;
p={x:1,y:1,dx:1,dy:0};
g=[
{x:7,y:6,c:"#F00",dx:0,dy:-1},
{x:8,y:6,c:"#FBF",dx:0,dy:-1},
{x:7,y:7,c:"#0FF",dx:0,dy:-1},
{x:8,y:7,c:"#FA0",dx:0,dy:-1},
{x:7,y:5,c:"#0F0",dx:0,dy:-1}
];
lt=performance.now();
}
function ok(x,y){return x>=0&&x<C&&y>=0&&y<R&&m[y][x]!=="#"}
function stepEnt(e,dt,isP){
let step=SPD*dt*(isP?1:0.92);
while(step>0){
let gx=Math.round(e.x),gy=Math.round(e.y);
let dist=Math.hypot(gx-e.x,gy-e.y);
if(dist<0.001){
e.x=gx;e.y=gy;
if(isP){
let d=D[nd];
if(ok(gx+d.x,gy+d.y)){cd=nd;e.dx=d.x;e.dy=d.y}
else if(!ok(gx+e.dx,gy+e.dy)){e.dx=0;e.dy=0;break}
}else{
let vd=D.filter(k=>ok(gx+k.x,gy+k.y));
let nr=vd.filter(k=>!(k.x===-e.dx&&k.y===-e.dy));
if(nr.length)vd=nr;
if(vd.length){
let ch=vd[Math.floor(Math.random()*vd.length)];
e.dx=ch.x;e.dy=ch.y;
}else{e.dx=0;e.dy=0;break}
}
if(e.dx===0&&e.dy===0)break;
let mv=Math.min(step,1);
e.x+=e.dx*mv;e.y+=e.dy*mv;step-=mv;
}else{
let toCenter=(e.dx>0&&gx>e.x)||(e.dx<0&&gx<e.x)||(e.dy>0&&gy>e.y)||(e.dy<0&&gy<e.y);
if(isP&&D[nd].x===-e.dx&&D[nd].y===-e.dy&&(e.dx!==0||e.dy!==0)){
cd=nd;e.dx=-e.dx;e.dy=-e.dy;continue;
}
let rem=toCenter?dist:(1-dist);
let mv=Math.min(step,rem);
e.x+=e.dx*mv;e.y+=e.dy*mv;step-=mv;
if(Math.abs(mv-rem)<0.0001){
e.x=Math.round(e.x);e.y=Math.round(e.y);
}
}
}
}
function upd(dt){
if(over)return;
if(pw>0)pw=Math.max(0,pw-dt);
stepEnt(p,dt,true);
let px=Math.round(p.x),py=Math.round(p.y);
if(Math.hypot(p.x-px,p.y-py)<0.35){
let v=m[py][px];
if(v==="."){m[py][px]=" ";sc+=10;sE.innerText=sc}
else if(v==="o"){m[py][px]=" ";sc+=50;pw=9;sE.innerText=sc}
}
if(!m.some(r=>r.includes(".")||r.includes("o"))){over=1;stE.innerText="LAIMĖJOTE!";return}
g.forEach(gh=>{
stepEnt(gh,dt,false);
if(!over&&Math.hypot(p.x-gh.x,p.y-gh.y)<0.65){
if(pw>0){gh.x=7;gh.y=6;gh.dx=0;gh.dy=-1;sc+=200;sE.innerText=sc}
else{over=1;stE.innerText="PABAIGA!"}
}
});
}
function drw(now){
ctx.clearRect(0,0,368,368);
for(let r=0;r<R;r++)for(let l=0;l<C;l++){
let v=m[r][l];
if(v==="#"){ctx.fillStyle="#0066B1";ctx.fillRect(l*T,r*T,T,T)}
else if(v==="."){ctx.fillStyle="#FFB8AE";ctx.beginPath();ctx.arc(l*T+11.5,r*T+11.5,3,0,7);ctx.fill()}
else if(v==="o"){ctx.fillStyle="#FFB8AE";ctx.beginPath();ctx.arc(l*T+11.5,r*T+11.5,6.5,0,7);ctx.fill()}
}
let ix=p.x*T+11.5,iy=p.y*T+11.5;
let rot=cd*1.57,mo=over?0.5:Math.abs(Math.sin(now/85))*0.55+0.05;
ctx.fillStyle="#FF0";ctx.beginPath();ctx.arc(ix,iy,9.5,rot+mo,rot+Math.PI*2-mo);ctx.lineTo(ix,iy);ctx.fill();
g.forEach(gh=>{
let gx=gh.x*T+11.5,gy=gh.y*T+11.5;
let gc=gh.c;
if(pw>0){gc=(pw<=2&&Math.floor(now/140)%2===0)?"#FFF":"#22F"}
ctx.fillStyle=gc;
ctx.beginPath();ctx.arc(gx,gy,9.5,Math.PI,0);
ctx.lineTo(gx+9.5,gy+9.5);ctx.lineTo(gx-9.5,gy+9.5);ctx.fill();
});
}
function loop(now){
let dt=Math.min(0.05,(now-lt)/1000);
lt=now;
upd(dt);
drw(now);
requestAnimationFrame(loop);
}
let lw=0;
window.addEventListener("wheel",e=>{
e.preventDefault();
if(Date.now()-lw<120)return;
lw=Date.now();
turn(e.deltaY>0||e.deltaX>0?1:-1);
},{passive:false});
window.addEventListener("keydown",e=>{
if(e.key==="ArrowRight")nd=0;
if(e.key==="ArrowDown")nd=1;
if(e.key==="ArrowLeft")nd=2;
if(e.key==="ArrowUp")nd=3;
if(e.key==="Enter"||e.key==="r")init();
});
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{
if(e.touches.length>0){tx=e.touches.item(0).clientX;ty=e.touches.item(0).clientY}
});
document.addEventListener("touchend",e=>{
if(e.changedTouches.length>0){
let dx=e.changedTouches.item(0).clientX-tx;
let dy=e.changedTouches.item(0).clientY-ty;
if(Math.abs(dx)>Math.abs(dy)){if(dx>20)nd=0;else if(dx<-20)nd=2}
else{if(dy>20)nd=1;else if(dy<-20)nd=3}
}
});
init();
requestAnimationFrame(loop);
</script>
</body>
</html>
