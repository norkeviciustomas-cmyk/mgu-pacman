<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BMW MGU Pac-Man Pro</title>
<style>
body{background:#0b0e14;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden;touch-action:none}
.h{display:flex;justify-content:space-between;width:368px;font-size:15px;font-weight:bold;margin-bottom:4px}
.st-bar{height:20px;font-size:16px;font-weight:bold;color:#FFD700;margin-bottom:4px;text-align:center}
canvas{border:3px solid #0066B1;background:#000}
.btns{display:flex;gap:8px;margin-top:8px}
button{background:#1c2433;color:#fff;border:1px solid #0066B1;padding:10px 16px;font-size:16px;border-radius:6px;cursor:pointer}
button:active,button:focus{background:#0066B1;outline:none}
</style>
</head>
<body>
<div class="h">
<div>TAŠKAI: <span id="s">0</span></div>
<div style="color:#FFD700">REKORDAS: <span id="hs">0</span></div>
<div style="color:#4da6ff">LYGIS: <span id="lv">1</span></div>
</div>
<div id="st" class="st-bar"></div>
<canvas id="c" width="368" height="368"></canvas>
<div class="btns">
<button onclick="nd=3">▲</button>
<button onclick="nd=2">◀</button>
<button onclick="nd=1">▼</button>
<button onclick="nd=0">▶</button>
<button onclick="init(true)">Iš naujo</button>
</div>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d"),sE=document.getElementById("s"),hsE=document.getElementById("hs"),lvE=document.getElementById("lv"),stE=document.getElementById("st"),T=23,R=16,C=16,SPD=4.5;
const WCOLS=["#0066B1","#8A1538","#B86B00"];
const MAPS=[
[
"################",
"#o.....##.....o#",
"#.###..##..###.#",
"#..............#",
"#.###.#  #.###.#",
"#.....#  #.....#",
"#####.#  #.#####",
"#.....#  #.....#",
"#####.####.#####",
"#..............#",
"#.###.####.###.#",
"#..............#",
"#.###..##..###.#",
"#o.....##.....o#",
"#..............#",
"################"
],
[
"################",
"#o.....##.....o#",
"#.##.#.##.#.##.#",
"#....#....#....#",
"#.####.  .####.#",
"#.....#  #.....#",
"#.###.#  #.###.#",
"#.....#  #.....#",
"#.###.####.###.#",
"#..............#",
"#.##.######.##.#",
"#..............#",
"#.##.######.##.#",
"#o.....##.....o#",
"#.####.##.####.#",
"################"
],
[
"################",
"#o.....##.....o#",
"#.####.##.####.#",
"#......##......#",
"#.###.#  #.###.#",
"#...#.#  #.#...#",
"#.#...#  #...#.#",
"#.#...####...#.#",
"#..............#",
"#.####.##.####.#",
"#..............#",
"#.####.##.####.#",
"#......##......#",
"#o##.######.##o#",
"#..............#",
"################"
]
];
const D=[{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}];
let m=[],sc=0,hi=0,lvl=1,over=0,wait=0,pw=0,cd=0,nd=0,p={},g=[],lt=0,wCol="#0066B1";
try{hi=Number(localStorage.getItem("mgu_pac_hi"))||0;}catch(e){}
hsE.innerText=hi;
function addScore(pts){
sc+=pts;
sE.innerText=sc;
if(sc>hi){
hi=sc;
hsE.innerText=hi;
try{localStorage.setItem("mgu_pac_hi",hi);}catch(e){}
}
}
function turn(s){nd=(cd+s+4)%4}
function init(resetAll){
if(resetAll){sc=0;lvl=1;sE.innerText=0;}
let idx=(lvl-1)%MAPS.length;
let L=MAPS.at(idx);
wCol=WCOLS.at(lvl-1<WCOLS.length?lvl-1:(lvl-1)%WCOLS.length);
c.style.borderColor=wCol;
m=L.map(r=>r.split(""));
over=0;wait=0;pw=0;
lvE.innerText=lvl;stE.innerText="";
cd=0;nd=0;
p={x:1,y:1,dx:1,dy:0};
g=[
{x:7,y:6,c:"#F00",dx:0,dy:-1,alive:true},
{x:8,y:6,c:"#FBF",dx:0,dy:-1,alive:true},
{x:7,y:7,c:"#0FF",dx:0,dy:-1,alive:true},
{x:8,y:7,c:"#FA0",dx:0,dy:-1,alive:true},
{x:7,y:5,c:"#0F0",dx:0,dy:-1,alive:true}
];
lt=performance.now();
}
function ok(x,y){return x>=0&&x<C&&y>=0&&y<R&&m[y][x]!=="#"}
function stepEnt(e,dt,isP){
let gMult=Math.min(1.18,0.90+(lvl-1)*0.06);
let step=SPD*dt*(isP?1:gMult);
if(isP){
let gx=Math.round(e.x),gy=Math.round(e.y);
let dist=Math.hypot(gx-e.x,gy-e.y);
let d=D[nd];
if((d.x!==e.dx||d.y!==e.dy)&&dist<0.42&&ok(gx+d.x,gy+d.y)){
e.x=gx;e.y=gy;cd=nd;e.dx=d.x;e.dy=d.y;
}
}
while(step>0){
let gx=Math.round(e.x),gy=Math.round(e.y);
let dist=Math.hypot(gx-e.x,gy-e.y);
if(dist<0.001){
e.x=gx;e.y=gy;
if(isP){
let d=D[nd];
if(ok(gx+d.x,gy+d.y)){cd=nd;e.dx=d.x;e.dy=d.y}
else if(!ok(gx+e.dx,gy+e.dy)){e.dx=0;e.dy=0;break}
}else{
let vd=D.filter(k=>ok(gx+k.x,gy+k.y));
let nr=vd.filter(k=>!(k.x===-e.dx&&k.y===-e.dy));
if(nr.length)vd=nr;
if(vd.length){
let ch;
let smart=Math.min(0.75,(lvl-1)*0.22);
if(Math.random()<smart){
vd.sort((a,b)=>{
let da=Math.hypot((gx+a.x)-p.x,(gy+a.y)-p.y);
let db=Math.hypot((gx+b.x)-p.x,(gy+b.y)-p.y);
return pw>0?(db-da):(da-db);
});
ch=vd.shift();
}else{
ch=vd[Math.floor(Math.random()*vd.length)];
}
e.dx=ch.x;e.dy=ch.y;
}else{e.dx=0;e.dy=0;break}
}
if(e.dx===0&&e.dy===0)break;
let mv=Math.min(step,1);
e.x+=e.dx*mv;e.y+=e.dy*mv;step-=mv;
}else{
let toCenter=(e.dx>0&&gx>e.x)||(e.dx<0&&gx<e.x)||(e.dy>0&&gy>e.y)||(e.dy<0&&gy<e.y);
if(isP&&D[nd].x===-e.dx&&D[nd].y===-e.dy&&(e.dx!==0||e.dy!==0)){
cd=nd;e.dx=-e.dx;e.dy=-e.dy;continue;
}
let rem=toCenter?dist:(1-dist);
let mv=Math.min(step,rem);
e.x+=e.dx*mv;e.y+=e.dy*mv;step-=mv;
if(Math.abs(mv-rem)<0.0001){
e.x=Math.round(e.x);e.y=Math.round(e.y);
}
}
}
}
function upd(dt){
if(over||wait)return;
if(pw>0)pw=Math.max(0,pw-dt);
stepEnt(p,dt,true);
let px=Math.round(p.x),py=Math.round(p.y);
if(Math.hypot(p.x-px,p.y-py)<0.35){
let v=m[py][px];
if(v==="."){m[py][px]=" ";addScore(10);}
else if(v==="o"){
m[py][px]=" ";addScore(50);
pw=Math.max(3,9-(lvl-1)*1.2);
}
}
if(!m.some(r=>r.includes(".")||r.includes("o"))){
wait=1;lvl++;
stE.innerText="LYGIS "+lvl+"!";
setTimeout(()=>init(false),1500);
return;
}
g.forEach(gh=>{
if(!gh.alive)return;
stepEnt(gh,dt,false);
if(!over&&Math.hypot(p.x-gh.x,p.y-gh.y)<0.65){
if(pw>0){gh.alive=false;addScore(200);}
else{over=1;stE.innerText="PABAIGA!";}
}
});
}
function drw(now){
ctx.clearRect(0,0,368,368);
for(let r=0;r<R;r++)for(let l=0;l<C;l++){
let v=m[r][l];
if(v==="#"){ctx.fillStyle=wCol;ctx.fillRect(l*T,r*T,T,T)}
else if(v==="."){ctx.fillStyle="#FFB8AE";ctx.beginPath();ctx.arc(l*T+11.5,r*T+11.5,3,0,7);ctx.fill()}
else if(v==="o"){ctx.fillStyle="#FFB8AE";ctx.beginPath();ctx.arc(l*T+11.5,r*T+11.5,6.5,0,7);ctx.fill()}
}
let ix=p.x*T+11.5,iy=p.y*T+11.5;
let rot=cd*1.57,mo=over?0.5:Math.abs(Math.sin(now/85))*0.55+0.05;
ctx.fillStyle="#FF0";ctx.beginPath();ctx.arc(ix,iy,9.5,rot+mo,rot+Math.PI*2-mo);ctx.lineTo(ix,iy);ctx.fill();
g.forEach(gh=>{
if(!gh.alive)return;
let gx=gh.x*T+11.5,gy=gh.y*T+11.5;
let gc=gh.c;
if(pw>0){gc=(pw<=2&&Math.floor(now/140)%2===0)?"#FFF":"#22F"}
ctx.fillStyle=gc;
ctx.beginPath();ctx.arc(gx,gy,9.5,Math.PI,0);
ctx.lineTo(gx+9.5,gy+9.5);ctx.lineTo(gx-9.5,gy+9.5);ctx.fill();
});
}
function loop(now){
let dt=Math.min(0.05,(now-lt)/1000);
lt=now;
upd(dt);
drw(now);
requestAnimationFrame(loop);
}
let lw=0;
window.addEventListener("wheel",e=>{
e.preventDefault();
if(Date.now()-lw<110)return;
lw=Date.now();
turn(e.deltaY>0||e.deltaX>0?1:-1);
},{passive:false});
window.addEventListener("keydown",e=>{
if(e.key==="ArrowRight")nd=0;
if(e.key==="ArrowDown")nd=1;
if(e.key==="ArrowLeft")nd=2;
if(e.key==="ArrowUp")nd=3;
if(e.key==="Enter"||e.key==="r")init(true);
});
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{
if(e.touches.length>0){tx=e.touches.item(0).clientX;ty=e.touches.item(0).clientY}
});
document.addEventListener("touchend",e=>{
if(e.changedTouches.length>0){
let dx=e.changedTouches.item(0).clientX-tx;
let dy=e.changedTouches.item(0).clientY-ty;
if(Math.abs(dx)>Math.abs(dy)){if(dx>12)nd=0;else if(dx<-12)nd=2}
else{if(dy>12)nd=1;else if(dy<-12)nd=3}
}
});
init(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
